version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongo-pokeapi
    restart: always
    ports:
      - "27017:27017"
    volumes:
      # Volume para scripts de inicialização (executados apenas na primeira vez)
      - ./init-db:/docker-entrypoint-initdb.d:ro
      # Volume para persistência dos dados do banco
      - mongo-data:/data/db
      # Volume para logs do MongoDB
      - mongo-logs:/var/log/mongodb
    environment:
      # Credenciais do usuário administrador root
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      # Banco de dados que será inicializado
      MONGO_INITDB_DATABASE: pokeAPI
    networks:
      - mongo-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  mongo-express:  
    image: mongo-express:latest
    container_name: mongo-express-ui
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin@mongo-pokeapi:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mongo-network

# Definição dos volumes nomeados
volumes:
  mongo-data:
    driver: local
  mongo-logs:
    driver: local

# Definição da rede
networks:
  mongo-network:
    driver: bridge
