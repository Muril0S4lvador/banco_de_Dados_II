version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongo-pokeapi
    restart: always
    ports:
      - "27017:27017"
    volumes:
      # Volume para scripts de inicialização (executados apenas na primeira vez)
      - ./init-db:/docker-entrypoint-initdb.d:ro
      # Volume para persistência dos dados do banco
      - mongo-data:/data/db
    environment:
      # Credenciais do usuário administrador root
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      # Banco de dados que será inicializado
      MONGO_INITDB_DATABASE: pokeAPI
    networks:
      - mongo-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 3

  mongo-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mongo-client-app
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - MONGO_HOST=mongo-pokeapi
      - MONGO_PORT=27017
    networks:
      - mongo-network
    stdin_open: true
    tty: true

# Definição dos volumes nomeados
volumes:
  mongo-data:
    driver: local

# Definição da rede
networks:
  mongo-network:
    driver: bridge
